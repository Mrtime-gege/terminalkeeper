name: publish
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（必须与 package.json 版本一致）'
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name || inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: 校验 tag 与 package.json 版本一致
        run: |
          TAG="${{ github.ref_name || inputs.tag }}"
          VER=$(node -p "require('./package.json').version")
          echo "tag=$TAG version=v$VER"
          if [ "v$VER" != "$TAG" ]; then
            echo "::error::tag $TAG 与 package.json 版本 v$VER 不一致，拒绝发布"
            exit 1
          fi
      - name: 更新 npm
        run: |
          npm install -g npm@latest
          npm --version
      - name: 发布到 npm（OIDC Trusted Publishing，不使用任何长期 token）
        run: |
          echo "auth: OIDC (Trusted Publishing)"
          npm publish --access public --provenance --loglevel verbose
          VER=$(node -p "require('./package.json').version")
          echo "verify terminalkeeper@$VER"
          # registry 有传播延迟：重试，避免"发布成功但校验先失败"把 workflow 判红
          for i in $(seq 1 12); do
            if npm view "terminalkeeper@$VER" version >/dev/null 2>&1; then
              echo "verified terminalkeeper@$VER"
              exit 0
            fi
            sleep 5
          done
          echo "::error::发布后 60s 内未在 registry 看到 terminalkeeper@$VER"
          exit 1
