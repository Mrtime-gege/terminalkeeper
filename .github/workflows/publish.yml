name: publish
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（必须与 package.json 版本一致）'
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name || inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: 校验 tag 与 package.json 版本一致
        run: |
          TAG="${{ github.ref_name || inputs.tag }}"
          VER=$(node -p "require('./package.json').version")
          echo "tag=$TAG version=v$VER"
          if [ "v$VER" != "$TAG" ]; then
            echo "::error::tag $TAG 与 package.json 版本 v$VER 不一致，拒绝发布"
            exit 1
          fi
      - name: 更新 npm
        run: |
          npm install -g npm@latest
          npm --version
      - name: 发布到 npm（OIDC Trusted Publishing，不使用任何长期 token）
        run: |
          set -euo pipefail
          echo "auth: OIDC (Trusted Publishing)"
          VER=$(node -p "require('./package.json').version")
          # 幂等：工作流可能因 registry 传播延迟在“已发布但校验超时”处失败；
          # 重跑时跳过 publish，直接进入校验，避免 403 cannot publish over existing version。
          if npm view "terminalkeeper@$VER" version --prefer-online >/dev/null 2>&1; then
            echo "terminalkeeper@$VER already published; skip publish"
            exit 0
          fi
          npm publish --access public --provenance --loglevel verbose

      - name: 校验 npm registry
        run: |
          set -euo pipefail
          VER=$(node -p "require('./package.json').version")
          echo "verify terminalkeeper@$VER"
          # registry 传播可能超过 60s：最多等 5 分钟，且每次强制联网查询，避免缓存误判。
          for i in $(seq 1 60); do
            if npm view "terminalkeeper@$VER" version --prefer-online >/dev/null 2>&1; then
              echo "verified terminalkeeper@$VER (after $((i * 5))s max)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::发布后 300s 内未在 registry 看到 terminalkeeper@$VER"
          exit 1
