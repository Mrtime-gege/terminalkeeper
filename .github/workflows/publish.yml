name: publish
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（必须与 package.json 版本一致）'
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name || inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: 校验 tag 与 package.json 版本一致
        run: |
          TAG="${{ github.ref_name || inputs.tag }}"
          VER=$(node -p "require('./package.json').version")
          echo "tag=$TAG version=v$VER"
          if [ "v$VER" != "$TAG" ]; then
            echo "::error::tag $TAG 与 package.json 版本 v$VER 不一致，拒绝发布"
            exit 1
          fi
      - name: 更新 npm
        run: |
          npm install -g npm@latest
          npm --version
      - name: 发布到 npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
            echo "auth: NPM_TOKEN"
          else
            echo "auth: OIDC (Trusted Publishing)"
          fi
          npm publish --access public --provenance --loglevel verbose
          VER=$(node -p "require('./package.json').version")
          echo "verify terminalkeeper@$VER"
          npm view "terminalkeeper@$VER" version
